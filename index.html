    <script>
      // Ensure window.fetch has both getter and setter for extensions/test runners
      (function() {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // Ignore if already configurable
        }
      })();
    </script>
